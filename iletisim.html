    <main class="icerik-alani">
        <h2>Bizimle İletişime Geçin</h2>
        <p>Soru ve önerileriniz için aşağıdaki formu doldurabilirsiniz.</p>
        
        <form class="iletisim-formu">
            <label>Adınız Soyadınız:</label>
            <input type="text" id="isim" placeholder="Adınızı giriniz..." required>
            
            <label>E-posta Adresiniz:</label>
            <input type="email" id="eposta" placeholder="ornek@mail.com" required>
            
            <label>Mesajınız:</label>
            <textarea id="mesaj" rows="5" placeholder="Mesajınızı buraya yazınız..." required></textarea>
            
            <button type="button" class="gonder-btn" onclick="formKontrol()">Gönder</button>
        </form>
